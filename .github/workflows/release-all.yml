name: Release Android and Web

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_channel:
        description: Production publishes, acceptance signs without publishing, preview creates RC artifacts
        type: choice
        options: [production, acceptance, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.signing.outputs.android }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      signed: ${{ github.event_name == 'push' || inputs.release_channel != 'preview' }}
      production: ${{ github.event_name == 'push' || inputs.release_channel == 'production' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate tag and application versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$CHANNEL" == acceptance ]]; then
            [[ "$GITHUB_REF" == refs/heads/* ]]
            VERSION="$(node -p "require('./release/version.json').version")"
            TAG="v$VERSION"
          else
            [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "Select an existing version tag as the workflow ref."; exit 1; }
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
            VERSION="${TAG#v}"
          fi
          test -s "release/RELEASE_NOTES_${VERSION}.md"
          test "$(node -p "require('./apps/web/package.json').version")" = "$VERSION"
          grep -F "versionName \"$VERSION\"" apps/web/android/app/build.gradle
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Determine publishable Android signing availability
        id: signing
        env:
          SIGNED: ${{ github.event_name == 'push' || inputs.release_channel != 'preview' }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          provided = [bool(os.environ.get(key)) for key in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']]
          if any(provided) and not all(provided):
              raise SystemExit('Incomplete Android signing configuration')
          if os.environ.get('SIGNED') == 'true' and not all(provided):
              raise SystemExit('Signed acceptance and production require the existing Android signing secrets')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('android=' + str(all(provided)).lower() + '\n')
          PY
      - name: Validate canonical assets and rights
        run: |
          python scripts/validate_assets.py
          python scripts/validate_third_party.py
          python scripts/validate_version.py

  api:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify API and schema migrations
        working-directory: apps/api
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
          python -m pip install -r ../../scripts/requirements-security.txt
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-companion.txt

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies and build the offline Web app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix apps/web ci
          npm --prefix apps/web run build:offline
          python -m pip install playwright -r apps/api/requirements-companion.txt
          python -m playwright install chromium
      - name: Verify Windows PWA, migration, and standalone Companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/test_windows_platform.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-browser-evidence
          path: |
            work/pwa-windows.json
            work/windows-migration.json
          if-no-files-found: error

  android:
    if: needs.prepare.outputs.android == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_channel == 'preview')
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets and sync plugins
        working-directory: apps/web
        run: |
          npm ci
          npm run build:android
          npx cap sync android
      - name: Prepare optional private Android signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('KEYSTORE_BASE64')
          if encoded:
              (Path(os.environ['RUNNER_TEMP']) / 'calligraphy-release.jks').write_bytes(base64.b64decode(encoded, validate=True))
          PY
      - name: Build and verify APK signing
        working-directory: apps/web/android
        env:
          CALLIGRAPHY_REQUIRE_PRODUCTION_SIGNING: ${{ needs.prepare.outputs.signed == 'true' && '1' || '0' }}
          CALLIGRAPHY_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/calligraphy-release.jks', runner.temp) || '' }}
          CALLIGRAPHY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CALLIGRAPHY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CALLIGRAPHY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CALLIGRAPHY_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
          ./gradlew --stop
          python ../../../scripts/validate_package.py --apk app/build/outputs/apk/release/app-release.apk
          if [ "$CALLIGRAPHY_REQUIRE_PRODUCTION_SIGNING" = "1" ]; then
            python ../../../scripts/validate_android_release.py --apk app/build/outputs/apk/release/app-release.apk --output ../../../android-signing.json
          else
            python ../../../scripts/validate_android_release.py --apk app/build/outputs/apk/release/app-release.apk --allow-preview --output ../../../android-signing.json
          fi
      - name: Remove decoded keystore
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'calligraphy-release.jks').unlink(missing_ok=True)
          PY
      - name: Download and verify the signed Android upgrade baseline
        if: needs.prepare.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLIGRAPHY_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          mkdir -p work/android-baseline
          gh release download v0.10.0 --dir work/android-baseline --pattern 'CalligraphyStudio-Android-0.10.0.apk' --pattern 'SHA256SUMS.txt'
          (cd work/android-baseline && grep '  CalligraphyStudio-Android-0.10.0.apk$' SHA256SUMS.txt | sha256sum --strict --check -)
          cert="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs work/android-baseline/CalligraphyStudio-Android-0.10.0.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ "$cert" == "$(printf '%s' "$CALLIGRAPHY_ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')" ]]
      - name: Enable KVM on the hosted Android runner
        if: needs.prepare.outputs.signed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the production-signed app on Android
        if: needs.prepare.outputs.signed == 'true'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/test_android_upgrade.sh
      - uses: actions/upload-artifact@v7
        if: always() && needs.prepare.outputs.signed == 'true'
        with:
          name: android-upgrade-evidence
          path: work/android-upgrade/*
          if-no-files-found: warn
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test font selection from the packaged Android web assets
        run: |
          python -m pip install playwright pillow pypdf==6.14.0 pypdfium2==5.15.2
          python -m playwright install --with-deps chromium
          python -m zipfile -e apps/web/android/app/build/outputs/apk/release/app-release.apk work/android-bundle
          python -m http.server 5180 --bind 127.0.0.1 --directory work/android-bundle/assets/public > /tmp/calligraphy-apk-http.log 2>&1 &
          python scripts/test_japanese_font_selection.py --url http://127.0.0.1:5180 --output work/japanese-fonts-android.json
          python scripts/test_korean_browser.py --url http://127.0.0.1:5180 --output work/korean-fonts-android.json
          native_project=work/android-upgrade/typesetting-native-project.json
          args=()
          if [ -f "$native_project" ]; then args=(--native-project "$native_project"); fi
          python scripts/test_typesetting_browser.py --url http://127.0.0.1:5180/ --output work/typesetting-android.json "${args[@]}"
          python scripts/test_hybrid_pdf_browser.py --url http://127.0.0.1:5180/ --output work/hybrid-pdf-android
      - uses: actions/upload-artifact@v7
        with:
          name: android-japanese-font-evidence
          path: |
            work/japanese-fonts-android.json
            work/korean-fonts-android.json
            work/typesetting-android.json
            work/hybrid-pdf-android/*
          if-no-files-found: error
      - name: Prepare APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk "release-artifacts/CalligraphyStudio-Android-$VERSION.apk"
          cp apps/web/dist/build-meta.json release-artifacts/android-build-provenance.json
          cp android-signing.json release-artifacts/android-signing.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-artifacts/*
          if-no-files-found: error

  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build portable web bundle
        working-directory: apps/web
        run: |
          npm ci
          npm run build:offline
      - name: Visual feature and search regression tests
        working-directory: apps/web
        run: |
          node ../../scripts/build_third_party_notices.cjs --check
          npm run test:visual
          python ../../scripts/audit_dependencies.py
      - name: Browser regression tests
        run: |
          python -m pip install playwright pillow pypdf==6.14.0 pypdfium2==5.15.2
          python -m playwright install --with-deps chromium
          python -m http.server 5178 --directory apps/web/dist > /tmp/calligraphy-http.log 2>&1 &
          python scripts/test_studio_browser.py --url http://127.0.0.1:5178
          python scripts/test_visual_browser.py --url http://127.0.0.1:5178 --built
          python scripts/test_japanese_browser.py --url http://127.0.0.1:5178
          python scripts/test_extraction_browser.py --url http://127.0.0.1:5178
          python scripts/test_historical_page_browser.py --url http://127.0.0.1:5178 --output work/historical-page.json
      - uses: actions/upload-artifact@v7
        with:
          name: historical-page-evidence
          path: work/historical-page.json
          if-no-files-found: error
      - name: Package web bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/package_web.py --output "CalligraphyStudio-Web-$VERSION.zip"
          cp apps/web/dist/build-meta.json web-build-provenance.json
      - name: Verify packaged web assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/validate_package.py --web-zip "CalligraphyStudio-Web-$VERSION.zip"
      - name: Run browser checks from the offline ZIP
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m zipfile -e "CalligraphyStudio-Web-$VERSION.zip" work/offline-web
          python -m http.server 5179 --bind 127.0.0.1 --directory work/offline-web > /tmp/calligraphy-zip-http.log 2>&1 &
          python scripts/test_studio_browser.py --url http://127.0.0.1:5179
          python scripts/test_extraction_browser.py --url http://127.0.0.1:5179
          python scripts/test_japanese_font_selection.py --url http://127.0.0.1:5179 --output work/japanese-fonts-web.json --screenshot work/japanese-font-selection.png
          python scripts/test_korean_browser.py --url http://127.0.0.1:5179 --output work/korean-fonts-web.json
          python scripts/test_typesetting_browser.py --url http://127.0.0.1:5179/ --output work/typesetting-web.json --gallery work/typesetting-gallery
          python scripts/test_pwa_browser.py --url http://127.0.0.1:5179/ --output work/pwa-linux.json
          python scripts/test_i18n_browser.py --url http://127.0.0.1:5179/ --output work/i18n-web.json
          python scripts/test_restoration_browser.py --url http://127.0.0.1:5179/ --output work/restoration-web.json
          python scripts/test_hybrid_pdf_browser.py --url http://127.0.0.1:5179/ --output work/hybrid-pdf-web
      - uses: actions/upload-artifact@v7
        with:
          name: web-japanese-font-evidence
          path: |
            work/japanese-fonts-web.json
            work/japanese-font-selection.png
            work/korean-fonts-web.json
            work/typesetting-web.json
            work/typesetting-gallery/*.png
            work/pwa-linux.json
            work/i18n-web.json
            work/restoration-web.json
            work/hybrid-pdf-web/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: |
            CalligraphyStudio-Web-*.zip
            web-build-provenance.json
          if-no-files-found: error

  publish:
    if: always() && needs.prepare.outputs.production == 'true' && needs.prepare.result == 'success' && needs.api.result == 'success' && needs.windows.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success'
    needs: [prepare, api, windows, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: "*-release"
          merge-multiple: true
      - name: Verify one commit and create final receipts
        env:
          INCLUDE_ANDROID: ${{ needs.prepare.outputs.android }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$INCLUDE_ANDROID" = "true"
          python scripts/create_release_manifest.py --directory release-artifacts --commit "$RELEASE_COMMIT"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          notes="release/RELEASE_NOTES_${VERSION}.md"
          gh release create "$TAG" --verify-tag --draft --title "East Asian Calligraphy Workbench $TAG" --notes-file "$notes"
          gh release upload "$TAG" release-artifacts/*
          gh release download "$TAG" --dir draft-readback
          cmp release-artifacts/SHA256SUMS.txt draft-readback/SHA256SUMS.txt
          cmp release-artifacts/release-manifest.json draft-readback/release-manifest.json
          (cd draft-readback && sha256sum --strict --check SHA256SUMS.txt)
          python scripts/validate_package.py --web-zip "draft-readback/CalligraphyStudio-Web-$VERSION.zip"
          python scripts/validate_package.py --apk "draft-readback/CalligraphyStudio-Android-$VERSION.apk"
          gh release edit "$TAG" --draft=false --latest --notes-file "$notes"

      - name: Re-download published files and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$TAG" --dir published-artifacts
          cd published-artifacts
          sha256sum --strict --check SHA256SUMS.txt
          cd ..
          python scripts/validate_package.py --web-zip "published-artifacts/CalligraphyStudio-Web-$VERSION.zip"
