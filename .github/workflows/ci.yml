name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Old database, backup/restore and version rollback compatibility
        run: |
          python -m venv work/lmdb-old
          work/lmdb-old/bin/python -m pip install lmdb==2.3.0
          python scripts/test_lmdb_compatibility.py --old-python work/lmdb-old/bin/python
      - uses: actions/upload-artifact@v7
        with:
          name: lmdb-synthetic-compatibility
          path: work/lmdb-compat-report.json
          if-no-files-found: error
      - name: API tests
        working-directory: apps/api
        run: python -m pytest -q
      - name: Runtime dependency security
        run: |
          python -m pip install -r scripts/requirements-security.txt
          python -m pip_audit -r apps/api/requirements.txt
      - name: Licence and provenance validation
        run: |
          python scripts/validate_assets.py
          python scripts/report_japanese_coverage.py
          python scripts/build_unicode_layout_data.py --check
          python scripts/validate_third_party.py
          python scripts/validate_version.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Verify Capacitor file traversal cancellation
        run: node scripts/test_glob_cancellation.cjs
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Canonical software notices
        run: node scripts/build_third_party_notices.cjs --check
      - name: Deterministic visual tests
        working-directory: apps/web
        run: npm run test:visual
      - name: Pages build
        working-directory: apps/web
        env:
          VITE_STATIC_MODE: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:pages
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Built browser regression tests
        run: |
          python scripts/audit_dependencies.py
          npm --prefix apps/web run build:offline
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python -m http.server 5178 --directory apps/web/dist > /tmp/calligraphy-http.log 2>&1 &
          python scripts/test_studio_browser.py --url http://127.0.0.1:5178
          python scripts/test_visual_browser.py --url http://127.0.0.1:5178 --built
          python scripts/test_japanese_browser.py --url http://127.0.0.1:5178
          python scripts/test_extraction_browser.py --url http://127.0.0.1:5178
          python scripts/test_historical_page_browser.py --url http://127.0.0.1:5178 --output work/historical-page.json
          python scripts/test_japanese_font_selection.py --url http://127.0.0.1:5178 --output work/japanese-fonts-web.json --screenshot work/japanese-font-selection.png
          python scripts/test_korean_browser.py --url http://127.0.0.1:5178 --output work/korean-fonts-web.json
          python scripts/test_typesetting_browser.py --url http://127.0.0.1:5178/ --output work/typesetting-web.json --gallery work/typesetting-gallery
          python scripts/test_pwa_browser.py --url http://127.0.0.1:5178/ --output work/pwa-linux.json
          python scripts/test_i18n_browser.py --url http://127.0.0.1:5178/ --output work/i18n-web.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-japanese-font-evidence
          path: |
            work/japanese-fonts-web.json
            work/korean-fonts-web.json
            work/typesetting-web.json
            work/typesetting-gallery/*.png
            work/historical-page.json
            work/japanese-font-selection.png
            work/pwa-linux.json
            work/i18n-web.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies and build the offline Web app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix apps/web ci
          npm --prefix apps/web run build:offline
          python -m pip install playwright -r apps/api/requirements-companion.txt
          python -m playwright install chromium
      - name: Verify Windows PWA, migration, and standalone Companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/test_windows_platform.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-browser-evidence
          path: |
            work/pwa-windows.json
            work/windows-migration.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Build Android release APK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          npm --prefix apps/web ci
          npm --prefix apps/web run cap:sync
          cd apps/web/android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
          python ../../../scripts/validate_package.py --apk app/build/outputs/apk/release/app-release.apk
          python ../../../scripts/validate_android_release.py --apk app/build/outputs/apk/release/app-release.apk --allow-preview
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test font selection from the packaged Android web assets
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python -m zipfile -e apps/web/android/app/build/outputs/apk/release/app-release.apk work/android-bundle
          python -m http.server 5180 --bind 127.0.0.1 --directory work/android-bundle/assets/public > /tmp/calligraphy-apk-http.log 2>&1 &
          python scripts/test_japanese_font_selection.py --url http://127.0.0.1:5180 --output work/japanese-fonts-android.json
          python scripts/test_korean_browser.py --url http://127.0.0.1:5180 --output work/korean-fonts-android.json
          python scripts/test_typesetting_browser.py --url http://127.0.0.1:5180/ --output work/typesetting-android.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-japanese-font-evidence
          path: |
            work/japanese-fonts-android.json
            work/korean-fonts-android.json
            work/typesetting-android.json
          if-no-files-found: error
