version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The merger 3.x line targets Tailwind 4; retain the supported Tailwind 3 pair.
    # Remove this version-only restriction when the CSS framework migrates too.
    ignore:
      - dependency-name: tailwind-merge
        update-types: ['version-update:semver-major']
    groups:
      web-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      desktop-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
